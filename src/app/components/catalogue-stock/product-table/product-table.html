<!-- product-table.html -->
<div class="table-container">
  <div class="table-scroll">
    <table class="registry-table">
      <thead>
        <tr>
          <th class="align-left ps-col">Produit &amp; référence</th>
          <th class="align-left">Catégorie</th>
          <th class="align-center">Qté en stock</th>
          <th class="align-center">Seuil d'alerte</th>
          <th class="align-right">Marge unitaire</th>
          <th class="align-center">Actions</th>
        </tr>
      </thead>
      <tbody>
        @if (isLoading()) {
          @for (i of [1, 2, 3, 4, 5]; track i) {
            <tr app-product-skeleton-row class="skeleton-row"></tr>
          }
        } @else if (error()) {
          <tr><td colspan="6" class="empty-state-cell">{{ error() }}</td></tr>
        } @else if (produits().length === 0) {
          <tr><td colspan="6" class="empty-state-cell">Aucun produit trouvé</td></tr>
        } @else {
          @for (p of produits(); track p.id) {
            <tr app-product-table-row
              [produit]="p"
              [devise]="devise()"
              (edit)="edit.emit($event)"
              (supprimer)="supprimer.emit($event)"
              (voir)="voir.emit($event)"
            ></tr>
          }
        }
      </tbody>
    </table>
  </div>
</div>
