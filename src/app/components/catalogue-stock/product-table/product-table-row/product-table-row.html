<!-- product-table-row.html -->
<tr>
  <!-- Produit & Référence -->
  <td class="ps-3">
    <span class="fw-medium" style="color: var(--color-text);">{{ produit().nom }}</span>
    <div class="small mt-1" style="color: var(--color-text-muted);">Réf : {{ produit().reference }}</div>
  </td>

  <!-- Catégorie -->
  <td>
    <span class="badge rounded-pill border small fw-normal"
      style="background-color: var(--color-background); border-color: var(--color-border) !important; color: var(--color-text);">
      {{ produit().categorie }}
    </span>
  </td>

  <!-- Qté en stock -->
  <td class="text-center">
    <span
      class="fw-bold me-1"
      [class.text-warning]="statutStock() === 'warning'"
      [class.text-danger]="statutStock() === 'error'"
    >
      {{ produit().quantiteStock }}
    </span>
    @if (statutStock() === 'warning') {
      <span class="badge text-bg-warning" style="font-size: 0.6rem;">Stock bas</span>
    }
    @if (statutStock() === 'error') {
      <span class="badge text-bg-danger" style="font-size: 0.6rem;">Rupture</span>
    }
  </td>

  <!-- Seuil alerte -->
  <td class="text-center" style="color: var(--color-text-muted);">
    {{ produit().seuilAlerte }}
  </td>

  <!-- Marge unitaire -->
  <td
    class="text-end fw-medium font-monospace"
    [class.text-success]="margeUnitaire() >= 0"
    [class.text-danger]="margeUnitaire() < 0"
  >
    {{ margeUnitaire() | currency: devise() : 'symbol' : '1.0-0' }}
  </td>

  <!-- Actions -->
  <td class="text-center">
    <div class="d-flex justify-content-center gap-2">
      <button
        type="button"
        class="btn btn-sm btn-outline-secondary d-inline-flex align-items-center justify-content-center p-1"
        style="width: 32px; height: 32px;"
        (click)="edit.emit(produit())"
        title="Modifier"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
        </svg>
      </button>
      <button
        type="button"
        class="btn btn-sm btn-outline-danger d-inline-flex align-items-center justify-content-center p-1"
        style="width: 32px; height: 32px;"
        (click)="supprimer.emit(produit())"
        title="Supprimer"
      >
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="3 6 5 6 21 6"></polyline>
          <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          <line x1="10" y1="11" x2="10" y2="17"></line>
          <line x1="14" y1="11" x2="14" y2="17"></line>
        </svg>
      </button>
    </div>
  </td>
</tr>
