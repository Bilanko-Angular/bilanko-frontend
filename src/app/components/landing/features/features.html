<section class="py-5" id="fonctionnalites">
  <div class="container py-4">
    <div class="max-w-620 mb-5" appAnimateOnScroll>
      <span class="badge text-success bg-success-subtle border border-success mb-2 px-3 py-2 text-uppercase">Fonctionnalités</span>
      <h2 class="display-6 fw-bold mb-2">Tout ce qu'il faut pour tenir votre commerce à jour</h2>
      <p class="text-muted fs-5">Trois piliers simples, pensés pour le quotidien d'un petit commerce.</p>
    </div>

    <div class="row g-4">
      @for (feature of features; track feature.title; let i = $index) {
        <div class="col-md-4" appAnimateOnScroll [appAnimateOnScrollDelay]="i * 150">
          <div class="card h-100 border p-4 hover-lift">
            <div class="feature-icon rounded p-3 bg-success-subtle text-success d-inline-flex mb-3" style="width: fit-content;">
              <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="feature.svgPath" />
              </svg>
            </div>
            <h3 class="h5 fw-bold mb-2">{{ feature.title }}</h3>
            <p class="text-muted mb-0 fs-6">{{ feature.description }}</p>
          </div>
        </div>
      }
    </div>
  </div>
</section>
