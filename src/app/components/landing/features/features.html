<section class="features-section" id="fonctionnalites">
  <div class="container">

    <!-- Header -->
    <div class="mb-5" appAnimateOnScroll>
      <span class="section-badge">✦ Fonctionnalités</span>
      <h2 class="section-title">Tout ce qu'il faut pour tenir<br>votre commerce à jour</h2>
      <p class="section-subtitle">Trois piliers simples, pensés pour le quotidien d'un petit commerce.</p>
    </div>

    <!-- Cards -->
    <div class="row g-4">
      @for (feature of features; track feature.title; let i = $index) {
        <div class="col-md-4" appAnimateOnScroll [appAnimateOnScrollDelay]="i * 150">
          <div class="feature-card">
            <div class="feature-icon-wrap">
              <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor"
                   stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path [attr.d]="feature.svgPath" />
              </svg>
            </div>
            <h3 class="feature-title">{{ feature.title }}</h3>
            <p class="feature-desc">{{ feature.description }}</p>
          </div>
        </div>
      }
    </div>

  </div>
</section>
