<div class="action-cell">
  <button class="kebab-btn" (click)="toggle()" aria-label="Actions">⋮</button>
  @if (open()) {
    <div class="dropdown-menu">
      <button class="dropdown-item" (click)="select('view')">{{ prefs.t().view }}</button>
      <button class="dropdown-item" (click)="select('edit')">{{ prefs.t().edit }}</button>
      <button class="dropdown-item danger" (click)="select('delete')">{{ prefs.t().delete }}</button>
    </div>
  }
</div>
