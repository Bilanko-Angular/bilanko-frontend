<header class="bk-header">

  <!-- ==========================================================
       GAUCHE
  =========================================================== -->

  <div class="bk-header__left">

    <div class="bk-header__page-info">

      <p class="bk-header__breadcrumb">
        BILANKO
        <span>›</span>
        <strong>
          {{ breadcrumbCurrent }}
        </strong>
      </p>

      <h1 class="bk-header__page-title">
        {{ pageTitle }}
      </h1>

    </div>

  </div>


  <!-- ==========================================================
       RECHERCHE
  =========================================================== -->

  <div class="bk-header__search">

    <div class="bk-search-wrapper">

      <div class="bk-search-group">

        <!-- Icône -->
        <span class="bk-search-icon">

          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 16 16"
            fill="currentColor">

            <path
              d="M11.742 10.344a6.5 6.5 0 1 0-1.397
              1.398h-.001c.03.04.062.078.098.115l3.85
              3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85
              a1.007 1.007 0 0 0-.115-.099zm-5.242
              1.656a5.5 5.5 0 1 1 0-11 5.5 5.5
              0 0 1 0 11z">
            </path>

          </svg>

        </span>


        <!-- Champ -->
        <input
          type="search"
          class="bk-search-input"
          placeholder="Rechercher dans Bilanko..."
          aria-label="Recherche globale"
          [value]="searchTerm()"
          (input)="onSearch($event)"
          (keydown)="onSearchKeydown($event)"
          autocomplete="off">


        <!-- Effacer -->
        @if (searchTerm()) {

          <button
            type="button"
            class="bk-search-clear"
            (click)="clearSearch()"
            aria-label="Effacer la recherche">

            ×

          </button>

        }

      </div>


      <!-- ======================================================
           RESULTATS
      ======================================================= -->

      @if (searchTerm()) {

        <div class="bk-search-results">

          @if (searchResults().length === 0) {

            <div class="bk-search-empty">

              <span class="bk-search-empty__icon">
                🔎
              </span>

              <strong>
                Aucun résultat
              </strong>

              <small>
                Essayez un nom, une référence ou un client.
              </small>

            </div>

          }


          @for (
            result of searchResults();
            track result.type + '-' + result.id
          ) {

            <button
              type="button"
              class="bk-search-result"
              (click)="openResult(result)">


              <span class="bk-search-result__icon">

                @if (result.type === 'produit') {

                  📦

                } @else {

                  💰

                }

              </span>


              <span class="bk-search-result__content">

                <strong>
                  {{ result.title }}
                </strong>

                <small>
                  {{ result.subtitle }}
                </small>

              </span>


              <span class="bk-search-result__arrow">
                →
              </span>

            </button>

          }

        </div>

      }

    </div>

  </div>


  <!-- ==========================================================
       DROITE
  =========================================================== -->

  <div class="bk-header__right">


    <!-- MODE SOMBRE -->
    <button
      type="button"
      class="bk-icon-btn"
      (click)="themeService.toggle()"
      [attr.aria-label]="
        themeService.theme() === 'dark'
          ? 'Activer le mode clair'
          : 'Activer le mode sombre'
      "
      [attr.title]="
        themeService.theme() === 'dark'
          ? 'Mode clair'
          : 'Mode sombre'
      ">

      @if (themeService.theme() === 'dark') {

        <!-- Soleil -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 16 16"
          fill="currentColor">

          <path
            d="M8 4a4 4 0 1 0 0 8A4 4 0 0 0 8 4z">
          </path>

          <path
            d="M8 .5a.5.5 0 0 1 .5.5v1.4a.5.5
            0 0 1-1 0V1A.5.5 0 0 1 8 .5zM8
            13.6a.5.5 0 0 1 .5.5v1.4a.5.5
            0 0 1-1 0v-1.4a.5.5 0 0 1 .5-.5z">
          </path>

        </svg>

      } @else {

        <!-- Lune -->
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 16 16"
          fill="currentColor">

          <path
            d="M6.7 1.2a.7.7 0 0 1 .07.8A6.2
            6.2 0 0 0 6 4.9c0 3.5 2.8 6.3
            6.3 6.3.9 0 1.8-.2 2.6-.5a.7
            .7 0 0 1 .8.1.7.7 0 0 1
            .05.9A7.7 7.7 0 1 1 5.8
            .35a.7.7 0 0 1 .9.85z">
          </path>

        </svg>

      }

    </button>


    <!-- NOTIFICATIONS -->

    <button
      type="button"
      class="bk-icon-btn bk-notification-btn"
      aria-label="Notifications"
      title="Notifications">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="18"
        height="18"
        viewBox="0 0 16 16"
        fill="currentColor">

        <path
          d="M8 16a2 2 0 0 0 2-2H6a2
          2 0 0 0 2 2zM8 1.918l-.797.161A4.002
          4.002 0 0 0 4 6c0 .628-.134
          2.197-.459 3.742-.16.767-.376
          1.566-.663 2.258h10.244c-.287-.692
          -.502-1.49-.663-2.258C12.134
          8.197 12 6.628 12 6a4.002
          4.002 0 0 0-3.203-3.92L8
          1.917z">
        </path>

      </svg>

      <span class="bk-notification-badge">
        3
      </span>

    </button>


    <!-- PROFIL -->

    <button
      type="button"
      class="bk-profile-btn">

      <span class="bk-avatar">
        EM
      </span>

      <span class="bk-profile-text">

        <strong>
          Emmanuel
        </strong>

        <small>
          Administrateur
        </small>

      </span>

      <span class="bk-profile-arrow">
        ▾
      </span>

    </button>

  </div>

</header>
