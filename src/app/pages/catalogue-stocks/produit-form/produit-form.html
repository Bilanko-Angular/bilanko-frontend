<div class="bilanko-form-overlay" (click)="annuler.emit()">
  <form class="bilanko-form-card" (click)="$event.stopPropagation()" (ngSubmit)="onSubmit()">
    <div class="bilanko-form-header">
      <h3>{{ produitInitial() ? prefs.t().editProduct : prefs.t().newProduct }}</h3>
      <button type="button" class="bilanko-form-close" (click)="annuler.emit()" [title]="prefs.t().close">✕</button>
    </div>

    <label>{{ prefs.t().reference }}
      <input [(ngModel)]="reference" name="reference" required />
    </label>
    <label>{{ prefs.t().productName }}
      <input [(ngModel)]="nom" name="nom" required />
    </label>
    <label>{{ prefs.t().category }}
      <input [(ngModel)]="categorie" name="categorie" required />
    </label>
    <label>{{ prefs.t().purchasePrice }}
      <input type="number" [(ngModel)]="prixAchat" name="prixAchat" min="0" />
    </label>
    <label>{{ prefs.t().sellingPrice }}
      <input type="number" [(ngModel)]="prixVente" name="prixVente" min="0" />
    </label>
    <label>{{ prefs.t().stockQuantity }}
      <input type="number" [(ngModel)]="quantiteStock" name="quantiteStock" min="0" />
    </label>
    <label>{{ prefs.t().alertThreshold }}
      <input type="number" [(ngModel)]="seuilAlerte" name="seuilAlerte" min="0" />
    </label>

    <div class="bilanko-form-actions">
      <button type="button" class="btn btn-outline" (click)="annuler.emit()">{{ prefs.t().cancel }}</button>
      <button type="submit" class="btn btn-primary">{{ prefs.t().save }}</button>
    </div>
  </form>
</div>
