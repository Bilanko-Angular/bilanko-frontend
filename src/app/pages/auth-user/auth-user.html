<!-- src/app/pages/auth-user/auth-user.html -->
<section class="auth-container">
  <!-- Panneau gauche : décoration -->
  <div class="auth-decoration">
    <div class="auth-decoration-overlay"></div>
    <div class="auth-decoration-content">
      <div class="auth-brand">
        <span class="auth-brand-mark">
          <!-- Logo Bilanko original -->
          <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="currentColor" viewBox="0 0 16 16">
            <path d="M0 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v2h2a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-2H2a2 2 0 0 1-2-2V2zm2-1a1 1 0 0 0-1 1v8a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V2a1 1 0 0 0-1-1H2z"/>
          </svg>
        </span>
        <span class="auth-brand-name">Bilanko</span>
      </div>

      <h2 class="auth-decoration-title">
        Votre commerce, suivi comme un vrai registre
      </h2>
      <p class="auth-decoration-text">
        Stock, ventes, charges et marges au quotidien — et un dossier prêt
        pour votre banque en quelques clics.
      </p>

      <ul class="auth-feature-list">
        <li class="auth-feature-item">
          <span class="auth-feature-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M1 2.5A1.5 1.5 0 0 1 2.5 1h3A1.5 1.5 0 0 1 7 2.5v3A1.5 1.5 0 0 1 5.5 7h-3A1.5 1.5 0 0 1 1 5.5v-3zm8 0A1.5 1.5 0 0 1 10.5 1h3A1.5 1.5 0 0 1 15 2.5v3A1.5 1.5 0 0 1 13.5 7h-3A1.5 1.5 0 0 1 9 5.5v-3zm-8 8A1.5 1.5 0 0 1 2.5 9h3A1.5 1.5 0 0 1 7 10.5v3A1.5 1.5 0 0 1 5.5 15h-3A1.5 1.5 0 0 1 1 13.5v-3zm8 0A1.5 1.5 0 0 1 10.5 9h3a1.5 1.5 0 0 1 1.5 1.5v3a1.5 1.5 0 0 1-1.5 1.5h-3A1.5 1.5 0 0 1 9 13.5v-3z"/>
            </svg>
          </span>
          <span>Suivi du stock et des ventes</span>
        </li>
        <li class="auth-feature-item">
          <span class="auth-feature-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path fill-rule="evenodd" d="M0 0h1v15h15v1H0V0Zm14.817 3.113a.5.5 0 0 1 .07.704l-4.5 5.5a.5.5 0 0 1-.74.037L7.06 6.767l-3.656 5.027a.5.5 0 0 1-.808-.588l4-5.5a.5.5 0 0 1 .758-.06l2.609 2.61 4.15-5.073a.5.5 0 0 1 .704-.07Z"/>
            </svg>
          </span>
          <span>Calcul automatique des marges</span>
        </li>
        <li class="auth-feature-item">
          <span class="auth-feature-icon">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
              <path d="M14 4.5V14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V2a2 2 0 0 1 2-2h5.5L14 4.5zm-3 0A1.5 1.5 0 0 1 9.5 3V1H4a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1V4.5h-2z"/>
            </svg>
          </span>
          <span>Relevé et bilan générés en PDF</span>
        </li>
      </ul>
    </div>
  </div>

  <!-- Panneau droit : formulaire -->
  <div class="auth-form-panel">
    <div class="auth-form-wrapper">
      <!-- Bouton de thème -->
      <div class="auth-theme-toggle">
        <button
          type="button"
          class="bk-icon-btn bk-theme-btn"
          (click)="themeService.toggle()"
          [attr.aria-label]="themeService.theme() === 'dark' ? 'Activer le mode clair' : 'Activer le mode sombre'"
          [attr.title]="themeService.theme() === 'dark' ? 'Mode clair' : 'Mode sombre'">
          @if (themeService.theme() === 'dark') {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 4a4 4 0 1 0 0 8A4 4 0 0 0 8 4z"/>
              <path d="M8 .5a.5.5 0 0 1 .5.5v1.4a.5.5 0 0 1-1 0V1A.5.5 0 0 1 8 .5zM8 13.6a.5.5 0 0 1 .5.5v1.4a.5.5 0 0 1-1 0v-1.4a.5.5 0 0 1 .5-.5z"/>
              <path d="M2.5 2.5a.5.5 0 0 1 .708 0l.99.99a.5.5 0 0 1-.707.707l-.99-.99a.5.5 0 0 1 0-.708zM13.5 2.5a.5.5 0 0 1 0 .708l-.99.99a.5.5 0 0 1-.707-.707l.99-.99a.5.5 0 0 1 .708 0zM2.5 13.5a.5.5 0 0 1 0-.708l.99-.99a.5.5 0 0 1 .707.707l-.99.99a.5.5 0 0 1-.708 0zM13.5 13.5a.5.5 0 0 1-.708 0l-.99-.99a.5.5 0 0 1 .707-.707l.99.99a.5.5 0 0 1 0 .708z"/>
            </svg>
          } @else {
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 16 16" fill="currentColor">
              <path d="M6.7 1.2a.7.7 0 0 1 .07.8A6.2 6.2 0 0 0 6 4.9c0 3.5 2.8 6.3 6.3 6.3.9 0 1.8-.2 2.6-.5a.7.7 0 0 1 .8.1.7.7 0 0 1 .05.9A7.7 7.7 0 1 1 5.8 .35a.7.7 0 0 1 .9.85z"/>
            </svg>
          }
        </button>
      </div>

      <ng-content />
    </div>
  </div>
</section>
