<app-auth-user>
  <div class="auth-content w-100 d-flex justify-content-center align-items-center">
    <div class="w-100">
      @if (step() === 1) {
        <app-verify-mail (mailVerified)="onMailVerified($event)"></app-verify-mail>
      } @else if (step() === 2) {
        <app-input-otp-form (otpVerified)="onOtpVerified($event)" (restart)="onRestart()" [email]="email()"></app-input-otp-form>
      } @else if (step() === 3) {
        <app-reset-your-password (passwordReset)="onPasswordReset()" [token]="token()"></app-reset-your-password>
      }
    </div>
  </div>
</app-auth-user>
