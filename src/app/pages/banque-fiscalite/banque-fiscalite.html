<app-template>
  <div class="bk-shell">

    <!-- Hero -->
    <app-hero-bank
      [stockDisponible]="stockDisponible()"
      [dureeHistorique]="dureeHistorique()"
      [totalCA]="totalCA()"
      [etape]="etape()"
    ></app-hero-bank>

    <!-- Stepper -->
    <app-stepper-document
      [etape]="etape()"
      (allerA)="allerA($event)"
    ></app-stepper-document>

    <div class="bk-layout-split">
      <div class="bk-card bk-step-card bk-elevated">
        @switch (etape()) {

          @case (1) {
            <!-- Étape 1 : Sélection du type de dossier -->
            <app-select-type-document
              [typeDossier]="typeDossier()"
              (typeDossierChange)="choisirType($event)"
              (etapeSuivante)="etapeSuivante()"
            ></app-select-type-document>
          }

          @case (2) {
            <!-- Étape 2 : Identification du commerçant -->
            <app-identification-machand
              [raisonSociale]="raisonSociale()"
              (raisonSocialeChange)="raisonSociale.set($event)"
              [activite]="activite()"
              (activiteChange)="activite.set($event)"
              [adresse]="adresse()"
              (adresseChange)="adresse.set($event)"
              [niu]="niu()"
              (niuChange)="niu.set($event)"
              [dateCreation]="dateCreation()"
              (dateCreationChange)="dateCreation.set($event)"
            ></app-identification-machand>

            @if (typeDossier() === 'pret_bancaire') {
              <!-- Capital & besoins de financement (prêt bancaire) -->
              <app-capital-financial-needs
                [stockDisponible]="stockDisponible()"
                [dureeHistorique]="dureeHistorique()"
                [totalCA]="totalCA()"
                [banque]="banque()"
                (banqueChange)="banque.set($event)"
                [agence]="agence()"
                (agenceChange)="agence.set($event)"
                [capitalPropre]="capitalPropre()"
                (capitalPropreChange)="capitalPropre.set($event)"
                [objetsPret]="objetsPret"
                [objetPret]="objetPret()"
                (objetPretChange)="objetPret.set($event)"
                [montantDemande]="montantDemande()"
                (montantDemandeChange)="montantDemande.set($event)"
                [dureeMois]="dureeMois()"
                (dureeMoisChange)="dureeMois.set($event)"
                [garanties]="garanties()"
                (garantiesChange)="garanties.set($event)"
                [capaciteRemboursementMensuelle]="capaciteRemboursementMensuelle()"
                [montantMaxIndicatif]="montantMaxIndicatif()"
                [mensualiteEstimee]="mensualiteEstimee()"
                [montantDepasseCapacite]="montantDepasseCapacite()"
                [caMoyenMensuel]="caMoyenMensuel()"
              ></app-capital-financial-needs>
            }

            @if (typeDossier() === 'dsf_smt') {
              <!-- Informations fiscales (déclaration fiscale) -->
              <app-fiscality-information
                [regimeFiscal]="regimeFiscal()"
                (regimeFiscalChange)="regimeFiscal.set($event)"
                [exerciceFiscal]="exerciceFiscal()"
                (exerciceFiscalChange)="exerciceFiscal.set($event)"
                [centreImpots]="centreImpots()"
                (centreImpotsChange)="centreImpots.set($event)"
                [natureImpot]="natureImpot()"
                (natureImpotChange)="natureImpot.set($event)"
                [periodeDeclaration]="periodeDeclaration()"
                (periodeDeclarationChange)="periodeDeclaration.set($event)"
                [montantImpot]="montantImpot()"
                (montantImpotChange)="montantImpot.set($event)"
                [datePaiement]="datePaiement()"
                (datePaiementChange)="datePaiement.set($event)"
                [moyenPaiement]="moyenPaiement()"
                (moyenPaiementChange)="moyenPaiement.set($event)"
                [referencePaiement]="referencePaiement()"
                (referencePaiementChange)="referencePaiement.set($event)"
              ></app-fiscality-information>
            }

            <div class="bk-form-actions">
              <button class="btn btn-outline" (click)="etapePrecedente()">Retour</button>
              <button class="btn btn-primary" [disabled]="!peutContinuerEtape2()" (click)="etapeSuivante()">Continuer</button>
            </div>
          }

          @case (3) {
            <!-- Étape 3 : Chiffre d'affaires -->
            <app-revenue-activity
              [dureeHistorique]="dureeHistorique()"
              (dureeHistoriqueChange)="changerDureeHistorique($event)"
              [historique]="historique()"
              [maxCA]="maxCA()"
              [totalCA]="totalCA()"
              [caMoyenMensuel]="caMoyenMensuel()"
              [margeBrute]="margeBrute()"
              [moisSansVente]="moisSansVente()"
              [peutContinuerEtape3]="peutContinuerEtape3()"
              (etapePrecedente)="etapePrecedente()"
              (etapeSuivante)="etapeSuivante()"
            ></app-revenue-activity>
          }

          @case (4) {
            <!-- Étape 4 : Récapitulatif -->
            <app-summary
              [raisonSociale]="raisonSociale()"
              [activite]="activite()"
              [adresse]="adresse()"
              [niu]="niu()"
              [typeDossier]="typeDossier()"
              [montantDemande]="montantDemande()"
              [banque]="banque()"
              [agence]="agence()"
              [objetPret]="objetPret()"
              [dureeMois]="dureeMois()"
              [montantImpot]="montantImpot()"
              [natureImpot]="natureImpot()"
              [periodeDeclaration]="periodeDeclaration()"
              [centreImpots]="centreImpots()"
              [referencePaiement]="referencePaiement()"
              [totalCA]="totalCA()"
              [dureeHistorique]="dureeHistorique()"
              [margeBrute]="margeBrute()"
              [piecesAJoindre]="piecesAJoindre()"
              [erreurGeneration]="erreurGeneration()"
              [genereEnCours]="genereEnCours()"
              [peutGenerer]="peutGenerer()"
              (etapePrecedente)="etapePrecedente()"
              (genererDossier)="genererDossier()"
            ></app-summary>
          }
        }
      </div>

      <!-- Aside -->
      <app-aside-bank-fiscality
        [typeDossier]="typeDossier()"
        [montantDemande]="montantDemande()"
        [stockDisponible]="stockDisponible()"
        [dureeHistorique]="dureeHistorique()"
        [totalCA]="totalCA()"
        [margeBrute]="margeBrute()"
      ></app-aside-bank-fiscality>
    </div>
  </div>
</app-template>
