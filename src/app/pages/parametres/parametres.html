<app-template>
  <div class="bk-settings">

    <!-- =====================================================
         HEADER
    ====================================================== -->
    <header class="bk-settings__header">
      <div class="bk-settings__header-content">
        <div class="bk-settings__header-icon">
          <span class="material-symbols-outlined">settings</span>
        </div>
        <div>
          <h1 class="bk-settings__title">{{ prefs.t().settingsTitle }}</h1>
          <p class="bk-settings__subtitle">{{ prefs.t().settingsSubtitle }}</p>
        </div>
      </div>
    </header>

    <!-- =====================================================
         POPUP DE FEEDBACK (succès / erreur)
    ====================================================== -->
    <app-action-response-popup />

    <!-- =====================================================
         NAVIGATION DES ONGLETS
    ====================================================== -->
    <nav class="bk-settings__nav" role="tablist">
      <button type="button" class="bk-settings__tab" [class.active]="activeTab() === 'general'" (click)="setActiveTab('general')">
        <span class="material-symbols-outlined">person</span>
        <span>{{ prefs.t().general }}</span>
      </button>

      <button type="button" class="bk-settings__tab" [class.active]="activeTab() === 'compte'" (click)="setActiveTab('compte')">
        <span class="material-symbols-outlined">security</span>
        <span>{{ prefs.t().accountSecurity }}</span>
      </button>

      <button type="button" class="bk-settings__tab" [class.active]="activeTab() === 'notifications'" (click)="setActiveTab('notifications')">
        <span class="material-symbols-outlined">notifications</span>
        <span>{{ prefs.t().notifications }}</span>
      </button>

      <button type="button" class="bk-settings__tab" [class.active]="activeTab() === 'apparence'" (click)="setActiveTab('apparence')">
        <span class="material-symbols-outlined">palette</span>
        <span>{{ prefs.t().appearance }}</span>
      </button>
    </nav>

    <!-- =====================================================
         CONTENU DES ONGLETS
    ====================================================== -->
    <div class="bk-settings__content">
      @if (activeTab() === 'general') {
        <app-general-settings />
      }

      @if (activeTab() === 'compte') {
        <app-security-settings />
      }

      @if (activeTab() === 'notifications') {
        <app-notification-settings />
      }

      @if (activeTab() === 'apparence') {
        <app-apparence-settings />
      }
    </div>

  </div>
</app-template>
